; Android export preset for Godot 4.7 (config_version=5).
; One preset covers both debug and release. The editor export dialog
; and the CLI flags --export-debug / --export-release choose which.
; Display settings stay in project.godot (960x720, canvas_items, expand).
; Keystore passwords belong in .godot/export_credentials.cfg or the
; GODOT_ANDROID_KEYSTORE_* environment variables, not in this file.
; Godot 4.7 stores the runnable preset in [runnable_presets].
; runnable=true below is the 4.3–4.6 field; 4.7 still honors it.

[runnable_presets]

Android="Android"

[preset.0]

name="Android"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/android/stasiumxii.apk"
patches=PackedStringArray()
patch_delta_encoding=false
patch_delta_compression_level_zstd=19
patch_delta_min_reduction=0.1
patch_delta_include_filters="*"
patch_delta_exclude_filters=""
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

