; PC release presets. build_tools/pc_release/release.py copies this over the
; root export_presets.cfg inside its own build checkout only; the root file
; stays the shared (Android) one.

[preset.0]

name="Windows"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.json"
exclude_filter="docs/*, tests/*, build_tools/*, builds/*, launcher/*"
export_path="builds/windows/StasiumXII.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=false
application/product_name="STASIUM XII"
application/file_description="STASIUM XII PC build"

[preset.1]

name="Launcher"
platform="Windows Desktop"
runnable=false
dedicated_server=false
custom_features=""
export_filter="resources"
export_files=PackedStringArray("res://launcher/launcher.tscn", "res://launcher/launcher_boot.gd")
include_filter=""
exclude_filter=""
export_path="builds/windows/StasiumXII.pck"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=false
application/product_name="STASIUM XII"
application/file_description="STASIUM XII PC build"
