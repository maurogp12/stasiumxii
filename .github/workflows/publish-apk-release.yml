name: Publish sideload APK release

# A push to a download-only apk/<version> branch publishes that commit's
# stasiumxii-mobile-debug.apk as the GitHub prerelease mobile-<version>-debug
# (GitHub creates the tag). The in-game Actualizar button reads these releases.
#
# GitHub refuses any single git file over 100 MB, but a release asset may be
# up to 2 GB. So the APK can arrive split into 90 MB parts
# (stasiumxii-mobile-debug.apk.part-00, -01, ...) plus
# stasiumxii-mobile-debug.apk.sha256; the job joins the parts in order,
# checks the SHA-256 and publishes the whole APK under the usual name.
# A branch that carries the whole APK (older versions) still works.
on:
  push:
    branches:
      - "apk/**"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Join the APK parts
        run: |
          if ls stasiumxii-mobile-debug.apk.part-* >/dev/null 2>&1; then
            cat $(ls stasiumxii-mobile-debug.apk.part-* | sort) > stasiumxii-mobile-debug.apk
          fi
          test -f stasiumxii-mobile-debug.apk && ls -l stasiumxii-mobile-debug.apk
      - name: Check the SHA-256
        run: |
          if [ -f stasiumxii-mobile-debug.apk.sha256 ]; then
            sha256sum -c stasiumxii-mobile-debug.apk.sha256
          fi
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          VERSION="${BRANCH#apk/}"
          TAG="mobile-${VERSION}-debug"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" stasiumxii-mobile-debug.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" stasiumxii-mobile-debug.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "STASIUM XII mobile debug APK $VERSION" \
              --notes-file README.md \
              --prerelease
          fi
