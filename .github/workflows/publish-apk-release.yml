name: Publish sideload APK release

# A push to a download-only apk/<version> branch publishes that commit's
# stasiumxii-mobile-debug.apk as the GitHub prerelease mobile-<version>-debug
# (GitHub creates the tag). The in-game Actualizar button reads these releases.
on:
  push:
    branches:
      - "apk/**"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the APK is in the pushed commit
        run: test -f stasiumxii-mobile-debug.apk && ls -l stasiumxii-mobile-debug.apk
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          VERSION="${BRANCH#apk/}"
          TAG="mobile-${VERSION}-debug"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" stasiumxii-mobile-debug.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" stasiumxii-mobile-debug.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "STASIUM XII mobile debug APK $VERSION" \
              --notes-file README.md \
              --prerelease
          fi
